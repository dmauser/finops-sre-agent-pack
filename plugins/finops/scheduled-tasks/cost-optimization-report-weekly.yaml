  agentPrompt: |
    STRICT MANAGED-SCOPE PREAMBLE — complete this before any Azure analysis query, email, ListReports/GetReport call, or SaveReport call.

    Load `finops-managed-scope` SKILL.md, `scope.py` and helpers for agent `__AGENT_RESOURCE_ID__`. Dynamically GET current `managedResources`; resolve in scheduled mode. This task accepts no override. Broad RBAC or visibility must never expand the boundary.

    FAIL CLOSED if discovery is unavailable, malformed, empty, or cannot fully expand a configured management group: stop without querying analysis data, sending email, or saving a report, and return only the scope error.

    Use only resolved effective scopes. Follow the skill for independent scoped retrieval, complete pagination, overlap de-duplication, exact UsageDetails transport filtering, and disclosure of included, excluded, unattributed, unsupported, and partial/failed coverage. Never infer a parent or substitute scope.

    Azure operations are read-only: GET/read commands only; never use Azure POST, PUT, PATCH, DELETE, or a write tool.

    Follow managed-scope sections 6-7: isolated `run_id`, immutable snapshots, unmodified `CostMap` and installed source SHA. Every builder needs `cost_context=snapshot`; budget-only uses `make_budget_snapshot`. Never substitute periods/owners, erase unknowns or claim unverified savings.

    Author and SAVE the static snapshot Live Report `FinOps: Cost Optimization` now; do not ask questions or defer to chat.

    1. Call ListReports; call GetReport and reuse the exact-name report's `reportId`, or create it if absent.
    2. Run the complete read-only `finops-cost-optimization-report` SKILL.md contract for every effective scope. Use its seven underlying skills (including `finops-waste-finder`, `finops-commitment-advisor`, and `finops-sre-agent`), share only already scope-filtered UsageDetails, preserve direct management-group budgets, and continue with explicit empty/partial sections when one source fails (for example, missing Reservations Reader). Follow its execution order: finish the single trailing-30-day UsageDetails `nextLink` chain before other calls; then pull utilization metrics for at least the top 15 compute candidates by cost; pass `inventory_unavailable` on commitment 403s.
    3. Run bundled `summarize.py` with `waste=`, `commitments=`, `sre_agents=`, and `spend_period=(first usage date, last usage date)` of the rows actually analyzed (the report states this window; Consumption may return only the current billing period). Keep each priority's `impact_type`; never sum savings, overruns, spikes, and governance exposure, and keep usage optimization separate from rate optimization.
    4. Load `finops-report-renderer`, its SKILL.md, exact `models.py`, and exact `render.py`. With `datetime.now(timezone.utc)`, call `build_cost_optimization_model(summarize_result, ...)`. Carry source gaps, daily cost lag, run-rate estimates, and `verify first` rows; do not generically construct a model or write/edit HTML. Run `write_report(model, "finops-cost-optimization.html")`.
    5. SaveReport the generated static file with `allowedTools: []`, name `FinOps: Cost Optimization`, and the reused `reportId` when present. Make no view-time calls. Confirm the saved report id and version.
