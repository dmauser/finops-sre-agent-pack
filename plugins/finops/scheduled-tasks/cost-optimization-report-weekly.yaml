  name: "FinOps: Cost Optimization (Live Report, Weekly)"
  description: >-
    Part of the FinOps pack — a weekly-refreshed Live Report (Operations Hub) executive
    rollup for Azure: potential savings, cost anomalies, budget status, and governance
    findings, with one prioritized action list.
  agent: "__AGENT_NAME__"
