  name: "FinOps: Monthly Review (KPI Scorecard)"
  description: >-
    Part of the FinOps pack — the monthly FinOps review, saved as a Live Report (Operations
    Hub): KPI scorecard with tag and budget governance checks, month-end and next-month
    forecast, month-over-month variance, unit economics, and one action list per owner.
  agent: "__AGENT_NAME__"
  cron: "__MONTHLY_REVIEW_CRON__"
  modelTier: "ReasoningHeavy"
  agentPrompt: |
    STRICT MANAGED-SCOPE PREAMBLE — complete this before any Azure analysis query, email, ListReports/GetReport call, or SaveReport call.

    Load `finops-managed-scope`; follow its current SKILL.md, bundled `scope.py`, and deterministic helpers with agent resource ID `__AGENT_RESOURCE_ID__`. Dynamically GET the current `managedResources` and resolve them in scheduled mode. This task accepts no override. Broad RBAC or visibility must never expand the boundary.

    FAIL CLOSED if discovery is unavailable, malformed, empty, or cannot fully expand a configured management group: stop without querying analysis data, sending email, or saving a report, and return only the scope error.

    Use only the resolved effective scopes. Follow the skill contract for independent scoped retrieval, complete pagination, overlap de-duplication, exact UsageDetails transport filtering, and disclosure of included, excluded, unattributed, unsupported, and partial/failed coverage. Never infer a parent or substitute scope.

    Azure operations are read-only: GET/read commands only; never use Azure POST, PUT, PATCH, DELETE, or a write tool.

    Follow managed-scope sections 6-7: unique `run_id`, isolated inputs, complete export generation or disclosed UsageDetails fallback, immutable ledger and `cost_context=snapshot` in every report builder. Never delete shared scratch, substitute a different month, treat unknown as zero, or promote unverified savings.

    Author and SAVE the static snapshot Live Report `FinOps: Monthly Review` with the monthly FinOps review for the month that just closed, for every effective scope; do not ask questions or defer to chat.

    0. Use the preamble's unique run directory and start time. Obtain AmortizedCost for exactly the closed month and the month before it from complete, independently selected export generations when configured. Otherwise pull UsageDetails once per effective scope and follow the managed-scope complete-chain contract with thread and start-time filters. Filter dates client-side; never mix independent continuation chains. If either closed month is unavailable, retain the requested closed-month title and show its cost/variance as unavailable with the requested vs obtained ranges. Never substitute current MTD or extrapolate a complete month from a fragment. Save non-usage inputs with `save_finops_input(..., run_id=run_id)` and load only those named inputs.
    1. Run the read-only `finops-cost-optimization-report` SKILL.md contract once (its seven underlying skills, including `finops-sre-agent`) over the last 30 days of the shared dataset. Continue with explicit empty/partial sections when one source fails.
    2. Run `finops-cost-allocation` and its `allocate.py` `month_over_month` over the closed month vs the month before it (both from the shared dataset), by the owner/team tag, so variance is explained by owner and by resource.
    3. Run the `finops-kpi-scorecard` SKILL.md contract with bundled `scorecard.py`: run `evaluate_budgets(load_finops_input("budgets", run_id=run_id))` and pass it as `budgets=`. Match forecast and budget scope, currency, filters, basis and calendar window exactly; never add overlapping budgets. Do not set `missing_days_are_zero=True` without a complete export attesting that coverage. Run unit economics only with a real matching unit metric. Run `kpi_scorecard` and `route_to_owners` with exact managed scopes, observed days and unmodified anomaly provenance. For forecast accuracy, retrieve the prior review and call `prior_forecast_inputs`; incomplete actuals must remain unavailable.
    4. Call ListReports; call GetReport and reuse the exact-name report's `reportId`, or create it if absent.
    5. Load `finops-report-renderer`, its SKILL.md, exact `models.py`, and exact `render.py`. With `datetime.now(timezone.utc)`, call `build_monthly_review_model({"month": <closed month YYYY-MM>, "scorecard": kpi_scorecard_result, "forecast": forecast_result, "month_over_month": month_over_month_result, "routing": route_to_owners_result, "unit_economics": unit_economics_result or None, "sre_agents": sre_agent_result or None}, ...)` with `partial=True` and source-gap warnings when any input was partial; do not generically construct a model or write/edit HTML. Run `write_report(model, "finops-monthly-review.html")`.
    6. SaveReport the generated static file with `allowedTools: []`, name `FinOps: Monthly Review`, and the reused `reportId` when present. Make no view-time calls. Confirm the saved report id and version. If ListReports, GetReport, or SaveReport is unavailable or fails after the analysis succeeds, state that report delivery failed but continue; a report-tool failure must never suppress the scheduled result or email.
    7. Return: the scorecard table, KPI health and evidence coverage (not organizational maturity); governance checks with uncovered budget scopes; available forecasts and month-over-month movers; unit economics when supported; SRE Agent spend and unreconciled amounts; owner actions and unrouted items; the saved report ID and source gaps.
    8. If `__ALERT_EMAIL__` is configured, email the review with subject `Monthly FinOps review — <month>` and Normal importance; otherwise return it only in the scheduled-task result.

    Recommend only; never modify resources. Remediation is proposed as owner actions or IaC pull requests that humans review.
