    Azure operations are read-only: GET/read commands only; never use Azure POST, PUT, PATCH, DELETE, or a write tool.

    Author and SAVE the static snapshot Live Report `FinOps: Monthly Review` with the monthly FinOps review for the month that just closed, for every effective scope; do not ask questions or defer to chat.

    1. Run the read-only `finops-cost-optimization-report` SKILL.md contract once (its six underlying skills, one shared trailing-30-day AmortizedCost UsageDetails chain). Continue with explicit empty/partial sections when one source fails.
    2. Run `finops-cost-allocation` and its `allocate.py` `month_over_month` over the closed month vs the month before it (one AmortizedCost UsageDetails pull per month), by the owner/team tag, so variance is explained by owner and by resource.
    3. Run the `finops-kpi-scorecard` SKILL.md contract with bundled `scorecard.py`: `forecast_spend` on 60 days of daily AmortizedCost (with the scope budget when one exists), `unit_economics` only when a real unit metric is available, `kpi_scorecard` over the step 1-2 results with the effective managed scopes, and `route_to_owners` over waste, rightsizing, and anomaly findings.
    4. Call ListReports; call GetReport and reuse the exact-name report's `reportId`, or create it if absent.
    5. Load `finops-report-renderer`, its SKILL.md, exact `models.py`, and exact `render.py`. With `datetime.now(timezone.utc)`, call `build_monthly_review_model({"month": <closed month YYYY-MM>, "scorecard": kpi_scorecard_result, "forecast": forecast_result, "month_over_month": month_over_month_result, "routing": route_to_owners_result, "unit_economics": unit_economics_result or None}, ...)` with `partial=True` and source-gap warnings when any input was partial; do not generically construct a model or write/edit HTML. Run `write_report(model, "finops-monthly-review.html")`.
    6. SaveReport the generated static file with `allowedTools: []`, name `FinOps: Monthly Review`, and the reused `reportId` when present. Make no view-time calls. Confirm the saved report id and version. If ListReports, GetReport, or SaveReport is unavailable or fails after the analysis succeeds, state that report delivery failed but continue; a report-tool failure must never suppress the scheduled result or email.
    7. Return: the scorecard table (value, target, status), score and crawl/walk/run maturity; governance checks with uncovered budget scopes; the forecast with its band and budget status; the top month-over-month movers; unit economics when present; one action list per owner, then unrouted items as "needs an owner tag"; the ordered actions; and the saved report id. Label partial inputs.
    8. If `__ALERT_EMAIL__` is configured, email the review with subject `Monthly FinOps review — <month>` and Normal importance; otherwise return it only in the scheduled-task result.

    Recommend only; never modify resources. Remediation is proposed as owner actions or IaC pull requests that humans review.
