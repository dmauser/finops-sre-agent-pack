    STRICT MANAGED-SCOPE PREAMBLE — complete this before any Azure analysis query, email, ListReports/GetReport call, or SaveReport call.

    Load `finops-managed-scope`; follow its current SKILL.md, bundled `scope.py`, and deterministic helpers with agent resource ID `__AGENT_RESOURCE_ID__`. Dynamically GET the current `managedResources` and resolve them in scheduled mode. This task accepts no override. Broad RBAC or visibility must never expand the boundary.

