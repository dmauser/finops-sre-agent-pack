    3. Load `finops-report-renderer`, its SKILL.md, exact `models.py`, and exact `render.py`. With `datetime.now(timezone.utc)`, call `build_commitment_model(commitment_result, ...)`; do not generically construct a model or write/edit HTML. Run `write_report(model, "finops-commitments.html")`.
    4. SaveReport the generated static file with `allowedTools: []`, name `FinOps: Commitments`, and the reused `reportId` when present. Make no view-time calls. Confirm the saved report id and version.
